[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentg"
version = "0.1.0"
description = "Gym coach Agent: chat-based coaching for gym members on Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents[litellm,sqlalchemy]>=0.2.9",
    "aiogram>=3.13",
    "aiohttp>=3.10",  # the dashboard's embedded HTTP server (spec-dashboard §Stack)
    "qrcode>=7.4",  # invite-link QR on the Settings screen (spec-dashboard §Settings)
    "asyncpg>=0.29",
    "apscheduler>=3.10",
    "tzdata>=2024.1",  # IANA timezone data for zoneinfo (gym-local check-in times)
]

[project.scripts]
agentg = "agentg.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "mypy>=1.11",
]
# Deliberately NOT in `dev`: playwright pulls ~115 MB of browser binaries, and
# CI installs `dev` on every run. tests/test_375px_playwright.py skips itself
# when this is absent, so the default suite is unaffected.
#   uv pip install ".[browser]" && uv run playwright install chromium
browser = [
    "playwright>=1.40",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "judge: optional LLM-as-judge behavioral scoring (needs network + AGENTG_BEHAVIORAL_JUDGE=1)",
    "live: optional live-model behavioral sweeps (needs network + AGENTG_BEHAVIORAL_LIVE=1 and MODEL_API_KEY)",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
